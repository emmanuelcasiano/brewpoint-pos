<!-- @dsCard group="Theming" height=620 subtitle="Per-shop accent: one hex in, every accent token out, each pair checked at 4.5:1" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>AccentPicker</title></head>
<body>
<div class="bp-canvas" id="root" style="max-width:820px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px">
  <div class="bp-stack" style="gap:16px">
    <h2 class="bp-h-sm">Shop accent color</h2>
    <div class="bp-swatches" id="swatches"></div>
    <div class="bp-field" id="hexfield">
      <label class="bp-field__label" for="hex">Custom color</label>
      <input class="bp-input" id="hex" value="#E2A13B" maxlength="7" autocomplete="off" spellcheck="false">
      <span class="bp-field__error" id="hex-err" hidden><i data-icon="alert" data-size="16"></i>Enter a color like #1F8A8A</span>
    </div>
    <dl class="bp-readout" id="readout"></dl>
  </div>
  <div class="bp-stack" style="gap:16px">
    <span class="bp-eyebrow">Live preview</span>
    <div class="bp-row">
      <button class="bp-btn bp-btn--primary">Pay <span data-peso="37350"></span></button>
      <button class="bp-btn bp-btn--quiet">Hold order</button>
    </div>
    <div class="bp-row" style="align-items:stretch">
      <div class="bp-rail" style="width:132px"><button class="bp-rail__item" aria-current="true">Coffee</button><button class="bp-rail__item">Pastries</button></div>
      <button class="bp-tile is-selected" style="width:160px"><span class="bp-tile__qty">2</span><span class="bp-tile__name">Iced Latte</span><span class="bp-tile__foot"><span class="bp-tile__price" data-peso="14500"></span></span></button>
    </div>
    <label style="display:flex;align-items:center;gap:12px;min-height:44px"><input class="bp-check" type="checkbox" checked><span>Print receipt after payment</span></label>
  </div>
</div>
<script>
  var PRESETS = [['Crema', '#E2A13B'], ['Teal', '#1F8A8A'], ['Berry', '#9C3D54'], ['Matcha', '#5F7F3A'], ['Cobalt', '#3B5BDB'], ['Ink', '#222222']];
  var GROUND = { light: '#FFFCF8', dark: '#251B15' };
  var root = document.getElementById('root'), hexEl = document.getElementById('hex'), current = '#E2A13B';
  function theme() { return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
  function drawSwatches() {
    document.getElementById('swatches').innerHTML = PRESETS.map(function (p) {
      return '<button class="bp-swatch" style="--swatch:' + p[1] + '" aria-label="' + p[0] + ' ' + p[1] + '" aria-pressed="' + (p[1].toLowerCase() === current.toLowerCase()) + '" data-hex="' + p[1] + '"></button>';
    }).join('');
  }
  function row(name, fg, bg) {
    var r = BrewPoint.contrast(fg, bg), ok = r >= 4.5;
    return '<dt>' + name + '</dt><dd>' + r.toFixed(1) + ':1 ' + BrewPoint.icon(ok ? 'check' : 'x', 16) + '<span class="bp-sr">' + (ok ? 'passes' : 'fails') + '</span></dd>';
  }
  function apply() {
    var a = BrewPoint.applyAccent(root, current, theme());
    document.getElementById('readout').innerHTML =
      row('Text on accent', a.onAccent, a.accent) + row('Text on hover', a.onAccent, a.accentHover) + row('Text on pressed', a.onAccent, a.accentPressed) +
      row('Accent text on card', a.accentStrong, GROUND[theme()]) + row('Accent text on selected tile', a.accentStrong, a.accentSoft);
    drawSwatches();
  }
  document.getElementById('swatches').addEventListener('click', function (e) {
    var b = e.target.closest('[data-hex]'); if (!b) return;
    current = b.getAttribute('data-hex'); hexEl.value = current; document.getElementById('hexfield').classList.remove('bp-field--error'); document.getElementById('hex-err').hidden = true; apply();
  });
  hexEl.addEventListener('input', function () {
    var ok = /^#[0-9a-fA-F]{6}$/.test(hexEl.value);
    document.getElementById('hexfield').classList.toggle('bp-field--error', !ok);
    document.getElementById('hex-err').hidden = ok;
    if (ok) { current = hexEl.value; apply(); }
  });
  new MutationObserver(apply).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  BrewPoint.mount(); apply();
</script>
</body>
</html>
