name: CI

on:
  push:
  pull_request:
  # Run by hand from the Actions tab to make the gallery screenshot baselines.
  workflow_dispatch:

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, typecheck, test, build and smoke test
    runs-on: ubuntu-latest
    services:
      # A throwaway database for the row-level security tests; they rebuild it from empty.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brewpoint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brewpoint_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The tests set brewpoint_app's password from TEST_DATABASE_URL; a new one each run.
      - name: Set the app database login
        run: |
          APP_URL="postgresql://brewpoint_app:$(openssl rand -hex 16)@localhost:5432/brewpoint_test"
          echo "::add-mask::${APP_URL}"
          echo "TEST_DATABASE_URL=${APP_URL}" >> "$GITHUB_ENV"
      - run: pnpm lint
      - run: pnpm typecheck
      # No DATABASE_URL here: the tests refuse to run when a test URL equals it.
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      # The server needs its database logins and two-step key to start; in CI the logins point at
      # the throwaway test database, where the tests gave brewpoint_platform the app's password.
      - name: Set the server's start-up values
        run: |
          PLATFORM_URL="${TEST_DATABASE_URL/brewpoint_app/brewpoint_platform}"
          TOTP_KEY="$(openssl rand -base64 32)"
          echo "::add-mask::${PLATFORM_URL}"
          echo "::add-mask::${TOTP_KEY}"
          echo "PLATFORM_DATABASE_URL=${PLATFORM_URL}" >> "$GITHUB_ENV"
          echo "TOTP_ENCRYPTION_KEY=${TOTP_KEY}" >> "$GITHUB_ENV"
      - run: pnpm test:e2e
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

  # Makes the gallery's Linux Chromium screenshots and uploads them. Download the artifact,
  # check the images, and commit them under tests/e2e/gallery.spec.ts-snapshots/.
  update-gallery-snapshots:
    name: Update gallery screenshot baselines
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      E2E_SUITE: gallery
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @brewpoint/ui build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --update-snapshots=all -g screenshots
      - uses: actions/upload-artifact@v7
        with:
          name: gallery-snapshots
          path: tests/e2e/gallery.spec.ts-snapshots/
          if-no-files-found: error

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
