<!-- @dsCard group="Feedback" height=330 subtitle="Sync, stock, subscription and register states; always an icon and a word" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatusChip</title></head>
<body>
<div class="bp-canvas bp-stack" style="gap:20px">
  <div class="bp-stack" style="gap:8px">
    <span class="bp-eyebrow">Sync (tappable)</span>
    <div class="bp-row">
      <button class="bp-chip bp-chip--action bp-chip--success"><i data-icon="check" data-size="18"></i>Synced</button>
      <button class="bp-chip bp-chip--action bp-chip--info"><i data-icon="refresh" data-size="18" class="is-spin"></i>Syncing 3 sales</button>
      <button class="bp-chip bp-chip--action"><i data-icon="wifi-off" data-size="18"></i>Offline, 2 sales waiting</button>
      <button class="bp-chip bp-chip--action bp-chip--warning"><i data-icon="alert" data-size="18"></i>1 needs attention</button>
    </div>
  </div>
  <div class="bp-stack" style="gap:8px">
    <span class="bp-eyebrow">Stock and expiry</span>
    <div class="bp-row">
      <span class="bp-chip bp-chip--success"><i data-icon="check" data-size="16"></i>In stock</span>
      <span class="bp-chip bp-chip--warning"><i data-icon="alert" data-size="16"></i>Low, 3 left</span>
      <span class="bp-chip bp-chip--danger"><i data-icon="x" data-size="16"></i>Out of stock</span>
      <span class="bp-chip bp-chip--danger"><i data-icon="alert" data-size="16"></i>Negative stock</span>
      <span class="bp-chip bp-chip--warning"><i data-icon="clock" data-size="16"></i>Expires in 2 days</span>
      <span class="bp-chip bp-chip--danger"><i data-icon="calendar-x" data-size="16"></i>Expired</span>
    </div>
  </div>
  <div class="bp-stack" style="gap:8px">
    <span class="bp-eyebrow">Subscription and register</span>
    <div class="bp-row">
      <span class="bp-chip bp-chip--info"><i data-icon="clock" data-size="16"></i>Trial, 9 days left</span>
      <span class="bp-chip bp-chip--success"><i data-icon="check" data-size="16"></i>Active</span>
      <span class="bp-chip bp-chip--warning"><i data-icon="alert" data-size="16"></i>Payment failed</span>
      <span class="bp-chip bp-chip--danger"><i data-icon="lock" data-size="16"></i>Suspended</span>
      <span class="bp-chip"><i data-icon="lock" data-size="16"></i>Register closed</span>
    </div>
  </div>
</div>
<script>BrewPoint.mount();</script>
</body>
</html>
