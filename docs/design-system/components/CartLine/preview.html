<!-- @dsCard group="POS" height=640 subtitle="Cart panel: lines with modifiers, steppers, discount and total" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>CartLine</title></head>
<body>
<div class="bp-canvas">
  <section class="bp-cart" aria-label="Current order">
    <div style="padding:16px 0 4px;display:flex;justify-content:space-between;align-items:center">
      <h2 class="bp-h-md">Order 4</h2>
      <span class="bp-chip">Dine in</span>
    </div>
    <div class="bp-cartline">
      <span class="bp-cartline__name">Iced Latte</span>
      <span class="bp-cartline__total" data-peso="29000"></span>
      <ul class="bp-cartline__mods"><li>Oat milk +<span data-peso="3000"></span></li><li>Less ice</li></ul>
      <div class="bp-cartline__ctl">
        <div class="bp-stepper">
          <button class="bp-stepper__btn" aria-label="Decrease quantity"><i data-icon="minus"></i></button>
          <span class="bp-stepper__qty" aria-live="polite">2</span>
          <button class="bp-stepper__btn" aria-label="Increase quantity"><i data-icon="plus"></i></button>
        </div>
        <button class="bp-btn bp-btn--quiet bp-btn--sm"><i data-icon="trash" data-size="18"></i>Remove</button>
      </div>
    </div>
    <div class="bp-cartline">
      <span class="bp-cartline__name">Butter Croissant</span>
      <span class="bp-cartline__total" data-peso="9500"></span>
      <div class="bp-cartline__ctl">
        <div class="bp-stepper">
          <button class="bp-stepper__btn" aria-label="Decrease quantity"><i data-icon="minus"></i></button>
          <span class="bp-stepper__qty">1</span>
          <button class="bp-stepper__btn" aria-label="Increase quantity"><i data-icon="plus"></i></button>
        </div>
        <button class="bp-btn bp-btn--quiet bp-btn--sm"><i data-icon="trash" data-size="18"></i>Remove</button>
      </div>
    </div>
    <div class="bp-cart__foot">
      <div class="bp-sumrow"><span>Subtotal</span><span data-peso="41500"></span></div>
      <div class="bp-sumrow"><span>Discount 10%</span><span>&minus;<span data-peso="4150"></span></span></div>
      <div class="bp-sumrow bp-sumrow--total"><span>Total</span><span data-peso="37350"></span></div>
      <button class="bp-btn bp-btn--primary bp-btn--lg bp-btn--block">Pay <span data-peso="37350"></span></button>
    </div>
  </section>
</div>
<script>BrewPoint.mount();</script>
</body>
</html>
